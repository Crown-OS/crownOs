[package]
name = "crownos-config"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["marvelxcodes <ramakrishnan0046@gmail.com>"]
repository = "https://github.com/Crown-OS/crownos-config"
homepage = "https://github.com/Crown-OS/crownos-config"
description = "Shared settings schema and live-reloading configuration store for CrownOS."
keywords = ["crownos", "config", "ron", "settings", "wayland"]
categories = ["config", "os::linux-apis"]
readme = "README.md"
documentation = "https://docs.rs/crownos-config"

[dependencies]
dirs = "6"
notify = "8"
ron = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
xilem = { version = "0.4.0", optional = true }

[features]
# Deliberately empty. `xilem` gates exactly one module -- `xilem_view`, a set of
# view helpers for a settings panel that does not exist yet -- and turning it on
# by default made this settings-schema crate pull an entire GPU stack: 261
# dependencies instead of 24.
#
# Worse, it was a SECOND stack. crowndictator depends on both crownshell (vello
# 0.9 -> wgpu 29) and this crate, so with the default on it compiled wgpu 26,
# vello 0.6, masonry, winit and duplicate copies of calloop, kurbo, peniko and
# smithay-client-toolkit alongside the ones it actually uses.
#
# Consumers that genuinely want the views ask for them:
#     crownos-config = { version = "0.2", features = ["xilem"] }
default = []
xilem = ["dep:xilem"]

[profile.dev]
# See https://doc.rust-lang.org/cargo/reference/profiles.html#split-debuginfo
split-debuginfo = "unpacked"
