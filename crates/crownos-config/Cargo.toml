[package]
name = "crownos-config"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
notify = "8"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
xilem = { version = "0.4.0", optional = true }

[dev-dependencies]
ron = "0.12"

[features]
default = ["xilem"]
xilem = ["dep:xilem"]

[profile.dev]
# See https://doc.rust-lang.org/cargo/reference/profiles.html#split-debuginfo
split-debuginfo = "unpacked"
