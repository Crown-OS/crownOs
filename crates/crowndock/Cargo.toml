[package]
name = "crowndock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Application dock for CrownOS."
keywords = ["crownos", "wayland", "dock", "layershell", "desktop"]
categories = ["gui", "os::linux-apis"]
readme = "README.md"
documentation = "https://docs.rs/crowndock"

[dependencies]
crownshell = { workspace = true }

anyhow = { workspace = true }
log = { workspace = true }

vello = { workspace = true }
smithay-client-toolkit = { workspace = true, features = ["calloop"] }

tiny-skia = "0.11"
usvg = "0.43"
resvg = "0.43"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
] }
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
dirs = "5"
freedesktop_entry_parser = "1.3"
freedesktop-icons = "0.4"
