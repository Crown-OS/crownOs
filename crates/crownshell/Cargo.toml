[package]
name = "crownshell"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A Rust framework for building Wayland layer shell surfaces with Vello 2D graphics."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crownshell"
readme = "README.md"
keywords = ["crownos", "wayland", "vello", "gui", "layershell"]
categories = ["gui", "graphics", "rendering", "os::linux-apis"]

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }

smithay-client-toolkit = { workspace = true, features = ["calloop"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.13"
calloop-wayland-source = "0.3"

vello = { workspace = true }
parley = { workspace = true }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

# Used only by examples/. Declaring them as normal dependencies made every
# consumer of crownshell link them.
[dev-dependencies]
chrono = "0.4.45"
env_logger = { workspace = true }
